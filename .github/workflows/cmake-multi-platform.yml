name: Cross-Platform Build

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            preset: macos
            artifact-name: build-macos
            build-dir: build
          - os: windows-latest
            preset: windows
            artifact-name: build-windows
            build-dir: build
          - os: ubuntu-latest
            preset: nixos
            artifact-name: build-nixos
            build-dir: build

    steps:
      # ── Checkout ────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Install CMake 4.0 ───────────────────────────────────────────────────
      - name: Install CMake 4.0
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "4.0.0"

      - name: Verify CMake version
        run: cmake --version

      # ── macOS dependencies ──────────────────────────────────────────────────
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install curl nlohmann-json sdl3

      # ── Windows dependencies ────────────────────────────────────────────────
      - name: Install vcpkg (Windows)
        if: runner.os == 'Windows'
        run: |
          git clone https://github.com/microsoft/vcpkg.git C:\vcpkg
          C:\vcpkg\bootstrap-vcpkg.bat -disableMetrics
          echo "VCPKG_ROOT=C:\vcpkg" >> $env:GITHUB_ENV
          echo "C:\vcpkg" >> $env:GITHUB_PATH

      - name: Install dependencies via vcpkg (Windows)
        if: runner.os == 'Windows'
        run: |
          vcpkg install curl nlohmann-json sdl3 --triplet x64-windows
          echo "CMAKE_TOOLCHAIN_FILE=C:\vcpkg\scripts\buildsystems\vcpkg.cmake" >> $env:GITHUB_ENV

      # ── Linux / NixOS-style dependencies ───────────────────────────────────
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          # cURL
          sudo apt-get install -y libcurl4-openssl-dev
          # nlohmann/json
          sudo apt-get install -y nlohmann-json3-dev
          # SDL3 — not yet in apt on most runners, so build from source
          sudo apt-get install -y \
            build-essential \
            git \
            libgl1-mesa-dev \
            libegl1-mesa-dev \
            libgles2-mesa-dev \
            libdrm-dev \
            libgbm-dev \
            libwayland-dev \
            wayland-protocols \
            libxkbcommon-dev \
            libpulse-dev \
            libasound2-dev \
            libx11-dev \
            libxext-dev \
            libxi-dev \
            libxrandr-dev
          git clone --depth 1 --branch release-3.2.10 \
            https://github.com/libsdl-org/SDL.git /tmp/SDL3
          cmake -S /tmp/SDL3 -B /tmp/SDL3/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DSDL_TESTS=OFF \
            -DSDL_EXAMPLES=OFF
          cmake --build /tmp/SDL3/build --parallel $(nproc)
          sudo cmake --install /tmp/SDL3/build

      # ── Configure project ───────────────────────────────────────────────────

      # macOS: brew installs SDL3 into a versioned keg. We resolve the exact
      # paths at install time and bake them into GITHUB_ENV so the configure
      # step can pass them as hard CMake cache entries. This ensures FetchContent
      # sub-projects (like imgui) that call find_package(SDL3) also resolve
      # SDL3/SDL.h correctly, regardless of CMAKE_PREFIX_PATH inheritance.
      - name: Configure (macOS)
        if: runner.os == 'macOS'
        run: |
          SDL3_PREFIX="$(brew --prefix sdl3)"
          SDL3_INCLUDE="${SDL3_PREFIX}/include"
          SDL3_LIB="${SDL3_PREFIX}/lib"
          echo "Resolved SDL3 prefix: ${SDL3_PREFIX}"
          echo "SDL3 include dir: ${SDL3_INCLUDE}"
          ls "${SDL3_INCLUDE}/SDL3/" || echo "WARNING: SDL3 headers not found at expected path"
          cmake -S . -B ${{ matrix.build-dir }} \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${SDL3_PREFIX};$(brew --prefix)" \
            -DSDL3_DIR="${SDL3_PREFIX}/lib/cmake/SDL3" \
            -DSDL3_INCLUDE_DIR="${SDL3_INCLUDE}" \
            -DSDL3_LIBRARY="${SDL3_LIB}/libSDL3.dylib"

      # Linux: SDL3 was installed to /usr/local by cmake --install, so
      # it is already on the default search path - no extra flags needed.
      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: |
          cmake -S . -B ${{ matrix.build-dir }} \
            -DCMAKE_BUILD_TYPE=Release

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: |
          $SDL3_INCLUDE = "C:\vcpkg\installed\x64-windows\include"
          $SDL3_LIB     = "C:\vcpkg\installed\x64-windows\lib\SDL3.lib"
          $SDL3_DIR     = "C:\vcpkg\installed\x64-windows\share\sdl3"
          Write-Host "SDL3 include: $SDL3_INCLUDE"
          Write-Host "SDL3 lib:     $SDL3_LIB"
          if (Test-Path "$SDL3_INCLUDE\SDL3\SDL.h") {
            Write-Host "SDL3/SDL.h found OK"
          } else {
            Write-Error "WARNING: SDL3/SDL.h not found at $SDL3_INCLUDE\SDL3\SDL.h"
          }
          cmake -S . -B ${{ matrix.build-dir }} `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE=${{ env.CMAKE_TOOLCHAIN_FILE }} `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DCMAKE_PREFIX_PATH="C:\vcpkg\installed\x64-windows" `
            -DSDL3_DIR="$SDL3_DIR" `
            -DSDL3_INCLUDE_DIR="$SDL3_INCLUDE" `
            -DSDL3_LIBRARY="$SDL3_LIB"

      # ── Build ───────────────────────────────────────────────────────────────
      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          cmake --build ${{ matrix.build-dir }} \
            --config Release \
            --parallel $(sysctl -n hw.logicalcpu)

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: |
          cmake --build ${{ matrix.build-dir }} \
            --config Release \
            --parallel $(nproc)

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: |
          cmake --build ${{ matrix.build-dir }} `
            --config Release `
            --parallel $env:NUMBER_OF_PROCESSORS

      # ── Upload artifacts ────────────────────────────────────────────────────
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          # Adjust the path below to wherever your binaries / output land
          path: |
            ${{ matrix.build-dir }}/Release/**
            ${{ matrix.build-dir }}/**/*.so
            ${{ matrix.build-dir }}/**/*.dylib
            ${{ matrix.build-dir }}/**/*.dll
            ${{ matrix.build-dir }}/**/*.exe
            ${{ matrix.build-dir }}/*
            !${{ matrix.build-dir }}/**/*.o
            !${{ matrix.build-dir }}/**/*.obj
            !${{ matrix.build-dir }}/**/CMakeFiles/**
          retention-days: 7
          if-no-files-found: warn
