name: Minecraft Launcher build

on:
    push:
        branches: [ main ]
    pull_request:
        branches: [ main ]

    workflow_dispatch:
    
jobs:
    linux-build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v2

            - name: Install Dependencies
              run: | 
                sudo apt install libcurl4-openssl-dev

            - name: compile sdl3
              run: |
                git clone htttps://github.com/libsdl/sdl

            - name: Build app
              run: |
                mkdir build
                cd build
                cmake ..


