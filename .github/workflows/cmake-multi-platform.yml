name: Cross-Platform Build

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            preset: macos
            artifact-name: build-macos
            build-dir: build
          - os: windows-latest
            preset: windows
            artifact-name: build-windows
            build-dir: build
          - os: ubuntu-latest
            preset: nixos
            artifact-name: build-nixos
            build-dir: build

    steps:
      # ── Checkout ────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Install CMake 4.0 ───────────────────────────────────────────────────
      - name: Install CMake 4.0
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "4.0.0"

      - name: Verify CMake version
        run: cmake --version

      # ── macOS dependencies ──────────────────────────────────────────────────
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          # cURL (already present, but ensure dev headers)
          brew install curl
          # nlohmann/json
          brew install nlohmann-json
          # SDL3
          brew install sdl3

      # ── Windows dependencies ────────────────────────────────────────────────
      - name: Install vcpkg (Windows)
        if: runner.os == 'Windows'
        run: |
          git clone https://github.com/microsoft/vcpkg.git C:\vcpkg
          C:\vcpkg\bootstrap-vcpkg.bat -disableMetrics
          echo "VCPKG_ROOT=C:\vcpkg" >> $env:GITHUB_ENV
          echo "C:\vcpkg" >> $env:GITHUB_PATH

      - name: Install dependencies via vcpkg (Windows)
        if: runner.os == 'Windows'
        run: |
          vcpkg install curl nlohmann-json sdl3 --triplet x64-windows
          echo "CMAKE_TOOLCHAIN_FILE=C:\vcpkg\scripts\buildsystems\vcpkg.cmake" >> $env:GITHUB_ENV

      # ── Linux / NixOS-style dependencies ───────────────────────────────────
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          # cURL
          sudo apt-get install -y libcurl4-openssl-dev
          # nlohmann/json
          sudo apt-get install -y nlohmann-json3-dev
          # SDL3 — not yet in apt on most runners, so build from source
          sudo apt-get install -y \
            build-essential \
            git \
            libgl1-mesa-dev \
            libegl1-mesa-dev \
            libgles2-mesa-dev \
            libdrm-dev \
            libgbm-dev \
            libwayland-dev \
            wayland-protocols \
            libxkbcommon-dev \
            libpulse-dev \
            libasound2-dev \
            libx11-dev \
            libxext-dev \
            libxi-dev \
            libxrandr-dev
          git clone --depth 1 --branch release-3.2.10 \
            https://github.com/libsdl-org/SDL.git /tmp/SDL3
          cmake -S /tmp/SDL3 -B /tmp/SDL3/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DSDL_TESTS=OFF \
            -DSDL_EXAMPLES=OFF
          cmake --build /tmp/SDL3/build --parallel $(nproc)
          sudo cmake --install /tmp/SDL3/build

      # ── Configure project ───────────────────────────────────────────────────
      - name: Configure (macOS / Linux)
        if: runner.os != 'Windows'
        run: |
          cmake -S . -B ${{ matrix.build-dir }} \
            -DCMAKE_BUILD_TYPE=Release

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: |
          cmake -S . -B ${{ matrix.build-dir }} `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE=${{ env.CMAKE_TOOLCHAIN_FILE }} `
            -DVCPKG_TARGET_TRIPLET=x64-windows

      # ── Build ───────────────────────────────────────────────────────────────
      - name: Build (macOS / Linux)
        if: runner.os != 'Windows'
        run: |
          cmake --build ${{ matrix.build-dir }} \
            --config Release \
            --parallel $(nproc 2>/dev/null || sysctl -n hw.logicalcpu)

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: |
          cmake --build ${{ matrix.build-dir }} `
            --config Release `
            --parallel $env:NUMBER_OF_PROCESSORS

      # ── Upload artifacts ────────────────────────────────────────────────────
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          # Adjust the path below to wherever your binaries / output land
          path: |
            ${{ matrix.build-dir }}/Release/**
            ${{ matrix.build-dir }}/**/*.so
            ${{ matrix.build-dir }}/**/*.dylib
            ${{ matrix.build-dir }}/**/*.dll
            ${{ matrix.build-dir }}/**/*.exe
            ${{ matrix.build-dir }}/*
            !${{ matrix.build-dir }}/**/*.o
            !${{ matrix.build-dir }}/**/*.obj
            !${{ matrix.build-dir }}/**/CMakeFiles/**
          retention-days: 7
          if-no-files-found: warn
