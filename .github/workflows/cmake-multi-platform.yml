name: Minecraft Launcher build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  linux-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt install -y libcurl4-openssl-dev \
              pkg-config ninja-build gnome-desktop-testing libasound2-dev libpulse-dev \
              libaudio-dev libfribidi-dev libjack-dev libsndio-dev libx11-dev libxext-dev \
              libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev \
              libxkbcommon-dev libdrm-dev libgbm-dev libgl1-mesa-dev libgles2-mesa-dev \
              libegl1-mesa-dev libdbus-1-dev libibus-1.0-dev libudev-dev libthai-dev nlohmann-json3-dev 

      - name: Compile SDL3
        run: |
          git clone https://github.com/libsdl-org/SDL sdl
          cd sdl
          mkdir build && cd build
          cmake .. \
            -G Ninja \
            -DSDL_SHARED=ON \
            -DSDL_VIDEO=ON \
            -DSDL_RENDER=ON \
            -DSDL_EVENTS=ON \
            -DSDL_AUDIO=OFF \
            -DSDL_JOYSTICK=OFF \
            -DSDL_HAPTIC=OFF \
            -DSDL_SENSOR=OFF \
            -DSDL_CAMERA=OFF \
            -DSDL_GPU=OFF \
            -DSDL_HIDAPI=OFF \
            -DSDL_POWER=OFF \
            -DSDL_TRAY=OFF \
            -DSDL_TESTS=OFF \
            -DSDL_TEST_LIBRARY=OFF \
            -DSDL_DEPS_SHARED=OFF \
            -DSDL_PTHREADS=ON \
            -DSDL_GCC_ATOMICS=ON
          ninja -j $(nproc)
          sudo ninja install

      - name: Build app
        working-directory: ${{ github.workspace }}
        run: |
          mkdir build && cd build
          cmake .. -G Ninja
          ninja -j $(nproc)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MinecraftLauncher-linux
          path: build/MinecraftLauncher
