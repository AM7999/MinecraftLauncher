name: Minecraft Launcher build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  mac-intel-build:
    runs-on: macos-15-intel
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Install Dependencies
        run: |
          brew install curl nlohmann-json sdl3
      
      - name: Build Project
        run: |
          cmake -B build
          cmake --build build

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MinecraftLauncher_macOS-intel
          path: |
            build/MinecraftLauncher
            build/SDL3.dylib

  windows-build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install And Setup MinGW
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-sdl3
            mingw-w64-x86_64-curl
            mingw-w64-x86_64-nlohmann-json

      - name: Configure Project
        run: |
          cmake -B build -G Ninja -DCMAKE_PREFIX_PATH=/mingw64
      
      - name: Build Project
        run: cmake --build build

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MinecraftLauncher_Windows-x64
          path: |
            build/MinecraftLauncher.exe
            build/SDL3.dll
      
  linux-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt install -y libcurl4-openssl-dev \
              pkg-config ninja-build gnome-desktop-testing libasound2-dev libpulse-dev \
              libaudio-dev libfribidi-dev libjack-dev libsndio-dev libx11-dev libxext-dev \
              libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev \
              libxkbcommon-dev libdrm-dev libgbm-dev libgl1-mesa-dev libgles2-mesa-dev \
              libegl1-mesa-dev libdbus-1-dev libibus-1.0-dev libudev-dev libthai-dev nlohmann-json3-dev \
              libssl-dev patchelf

      - uses: libsdl-org/setup-sdl@main
        with:
          version: 3-latest
          install-linux-dependencies: true

      - name: Build app
        working-directory: ${{ github.workspace }}
        run: |
          mkdir build && cd build
          cmake .. -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
          ninja -j $(nproc)
          DESTDIR=${{ github.workspace }}/AppDir ninja install

      - name: Debug SDL3 location
        run: |
          echo "=== ldconfig ==="
          ldconfig -p | grep -i sdl || echo "not in ldconfig"
          echo "=== find / ==="
          find / -name "libSDL3*" -not -path "*/proc/*" 2>/dev/null
          echo "=== ldd on binary ==="
          ldd ${{ github.workspace }}/AppDir/usr/bin/MinecraftLauncher | grep -i sdl

      - name: Build AppImage
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage
          ./linuxdeploy-x86_64.AppImage --appimage-extract
          mv squashfs-root linuxdeploy

          # Locate libSDL3 via ldconfig, fall back to a manual search
          SDL3_LIB=$(ldconfig -p | grep "libSDL3.so" | awk '{print $NF}' | head -1)
          if [ -z "$SDL3_LIB" ]; then
            SDL3_LIB=$(find /usr/local/lib /usr/lib -name "libSDL3.so*" -not -type d 2>/dev/null | head -1)
          fi
          echo "Found SDL3 at: $SDL3_LIB"
          export LD_LIBRARY_PATH=$(dirname $SDL3_LIB):$LD_LIBRARY_PATH

          ARCH=x86_64 ./linuxdeploy/AppRun \
            --appdir AppDir \
            --output appimage

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MinecraftLauncher_Linux-x86_64
          path: MinecraftLauncher-x86_64.AppImage
