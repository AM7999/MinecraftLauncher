name: Minecraft Launcher build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  linux-build:
    runs-on: ubuntu-latest
    container:
      image: alpine:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          apk add --no-cache \
            build-base cmake ninja git pkgconf \
            curl-dev curl-static \
            openssl-dev openssl-libs-static \
            zlib-dev zlib-static \
            libx11-dev libxext-dev libxrandr-dev \
            libxcursor-dev libxfixes-dev libxi-dev \
            libxss-dev libxtst-dev libxkbcommon-dev \
            mesa-dev libdrm-dev libgbm-dev \
            dbus-dev eudev-dev \
            alsa-lib-dev \
            ibus-dev \
            fribidi-dev \
            nlohmann-json \
            linux-headers

      - name: Cache SDL3
        uses: actions/cache@v4
        with:
          path: /usr/local
          key: sdl3-${{ runner.os }}-release-3.2.10

      - name: Compile SDL3
        run: |
          git clone --branch release-3.2.10 --depth 1 \
            https://github.com/libsdl-org/SDL sdl
          cd sdl
          mkdir build && cd build
          cmake .. \
            -G Ninja \
            -DSDL_STATIC=ON \
            -DSDL_SHARED=OFF \
            -DSDL_VIDEO=ON \
            -DSDL_RENDER=ON \
            -DSDL_EVENTS=ON \
            -DSDL_AUDIO=OFF \
            -DSDL_JOYSTICK=OFF \
            -DSDL_HAPTIC=OFF \
            -DSDL_SENSOR=OFF \
            -DSDL_CAMERA=OFF \
            -DSDL_GPU=OFF \
            -DSDL_HIDAPI=OFF \
            -DSDL_POWER=OFF \
            -DSDL_TRAY=OFF \
            -DSDL_TESTS=OFF \
            -DSDL_TEST_LIBRARY=OFF \
            -DSDL_DEPS_SHARED=OFF \
            -DSDL_PTHREADS=ON \
            -DSDL_GCC_ATOMICS=ON \
            -DCMAKE_BUILD_TYPE=Release
          ninja -j $(nproc)
          ninja install

      - name: Build app
        run: |
          mkdir build && cd build
          cmake .. -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXE_LINKER_FLAGS="-static -static-libgcc -static-libstdc++" \
            -DCMAKE_FIND_LIBRARY_SUFFIXES=".a" \
            -DSDL3_DIR=/usr/local/lib/cmake/SDL3 \
            -DBUILD_SHARED_LIBS=OFF
          ninja -j $(nproc)

      - name: Verify binary exists
        run: test -f build/MinecraftLauncher

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MinecraftLauncher-linux
          path: build/MinecraftLauncher